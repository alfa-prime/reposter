services:
  postgres:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  migrate:
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini:ro

  app:
    ports:
      - "${APP_PORT:-8000}:8000"
    command:
      - uvicorn
      - news_reposter.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    volumes:
      - ./src:/app/src
