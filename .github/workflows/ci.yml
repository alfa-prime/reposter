name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  tests:
    name: Backend checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check Python lint
        run: uv run ruff check .

      - name: Check Python formatting
        run: uv run ruff format --check .

      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=60

  migrations:
    name: Alembic migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: news_reposter
          POSTGRES_USER: news_reposter
          POSTGRES_PASSWORD: news_reposter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U news_reposter -d news_reposter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_DB: news_reposter
      POSTGRES_USER: news_reposter
      POSTGRES_PASSWORD: news_reposter
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: uv sync --frozen

      - name: Upgrade database to head
        run: uv run alembic upgrade head

      - name: Check ORM models match migrations
        run: uv run alembic check

      - name: Run PostgreSQL authentication integration test
        env:
          RUN_POSTGRES_TESTS: "1"
        run: uv run pytest tests/test_auth_postgres.py

      - name: Downgrade database to base
        run: uv run alembic downgrade base

      - name: Upgrade database to head again
        run: uv run alembic upgrade head

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend scheduling
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs:
      - tests
      - migrations
      - frontend-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build --tag news-reposter:ci .

      - name: Build frontend image
        run: docker build --tag news-reposter-frontend:ci ./frontend
