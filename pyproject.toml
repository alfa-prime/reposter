[project]
name = "news-reposter"
version = "0.1.0"
description = "VK to MAX news reposter"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.10.1",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/news_reposter"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

